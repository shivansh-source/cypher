[project]
name = "suraksha"
version = "0.1.0"
description = "Su₹aksha — cyber risk quantification platform (SIH 2026, PS 26105). Converts security telemetry into rupee-denominated risk (EAL, VaR) via Open FAIR + Monte Carlo, recommends budget allocation, and maps findings to Indian regulatory frameworks."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

dependencies = [
    # TODO: pin real versions once implementation begins.
    "pydantic>=2",
    "numpy",
    "jsonschema",
    "pyyaml",
    "fastapi",
    "uvicorn",
    "typer",
    "httpx",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "mypy",
    "ruff",
    "types-PyYAML",
]

[tool.pytest.ini_options]
testpaths = ["core/tests", "governance/tests", "ai/tests"]

[tool.mypy]
python_version = "3.11"
strict = true
disallow_untyped_defs = true
# `pip install -e .` leaves a build/ scratch directory in the project root
# (a normal side effect of the setuptools backend, not a repo artifact —
# it's gitignored). Without this, mypy treats build/lib/<pkg>/__init__.py
# as a second copy of every top-level package and refuses to run at all.
exclude = ["^build/"]

[[tool.mypy.overrides]]
# numpy's own bundled .pyi stubs use `type X = ...` (PEP 695), which is
# Python 3.12+ only syntax — mypy fails to even parse them under this
# project's python_version = "3.11" target. This surfaces even though no
# project code imports numpy yet: pytest's own optional numpy integration
# (_pytest/python_api.py) pulls numpy in while mypy checks any test file
# that imports pytest, and neither ignore_errors nor follow_imports=skip on
# numpy itself prevents that parse (the failure happens while mypy resolves
# _pytest's own type info, before a numpy-targeted override applies).
# Skipping just this one pytest submodule (not all of _pytest, which would
# lose fixture-decorator typing everywhere) stops the chain at its source.
# Revisit if a newer mypy/numpy pairing fixes this, or once core/engine.py
# imports numpy for real and needs its types checked directly.
module = "_pytest.python_api"
follow_imports = "skip"

[tool.ruff]
line-length = 100
target-version = "py311"
# See the mypy `exclude` comment above — same reason.
extend-exclude = ["build"]

[tool.setuptools.packages.find]
# Explicit include list: this is a flat layout with several top-level
# packages (ai/, core/, governance/, infra/, interfaces/), which setuptools'
# automatic discovery refuses to guess between on its own. schema/ and docs/
# are intentionally excluded — they hold data/config and prose, not importable
# Python.
include = ["ai*", "core*", "governance*", "infra*", "interfaces*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
