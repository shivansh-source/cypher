# ISO/IEC 27001:2022 Annex A — control identifiers and titles only.
#
# The standard's full normative text is paywalled/copyrighted. Every
# `description` below is a one-line paraphrase in our own words, not
# standard text, and every entry is capped at confidence: medium (never
# high) because none of it came from the licensed primary document — see
# governance/control_library/README.md and the project's sourcing rules.
#
# See governance/control_library/README.md for the shape every file here
# follows, and governance/library_loader.py for how `telemetry_check` is
# actually evaluated (check_type/check_params dispatch to named functions
# in governance/mapper.py — `logic` is the human-readable description of
# the same rule, not executable itself).

framework: iso_27001
version: "ISO/IEC 27001:2022"
effective_from: "2022-10-25"
effective_to: null
supersedes: null

sources:
  - url_or_citation: "https://www.iso.org/standard/27001"
    retrieved: "2026-09-20"
    covers: "Publication date and existence of the 2022 revision"
  - url_or_citation: "https://hightable.io/iso-27001-2022-everything-you-need-to-know/"
    retrieved: "2026-09-20"
    covers: "Annex A control IDs and titles (cross-checked against dataguard.com)"
  - url_or_citation: "https://www.dataguard.com/iso-27001/2022/"
    retrieved: "2026-09-20"
    covers: "Annex A control IDs and titles (cross-checked against hightable.io)"
  - url_or_citation: "https://scrut.io"
    retrieved: "2026-09-20"
