controls:
  # --- Telemetry-derivable -------------------------------------------------
  - id: secure_authentication
    framework_ref: "A.8.5"
    parameter_name: "Secure authentication"
    weight: null
    description: "Secure authentication procedures and technologies should be used for user and system access, in line with access control requirements."
    maturity_bands: null
    source: "https://hightable.io/iso-27001-2022-everything-you-need-to-know/ ; https://www.dataguard.com/iso-27001/2022/"
    confidence: medium
    verified_by_human: false
    telemetry_check:
      derivable_from_telemetry: true
      source_field: "assets[].identity_access.mfa_enforced"
      logic: "MFA must be enforced on every in-scope asset; a null value means the fact was never evaluated, not that it failed."
      check_type: "all_assets_field_true"
      check_params: { field_path: "identity_access.mfa_enforced" }
    manual_attestation_required: false
    attestation_prompt: null
    attestation_validity_months: null

  - id: access_control_policy
    framework_ref: "A.5.15"
    parameter_name: "Access control"
    weight: null
    description: "Rules to control physical and logical access to information and other associated assets should be established and implemented based on business requirements."
    maturity_bands: null
    source: "https://hightable.io/iso-27001-2022-everything-you-need-to-know/ ; https://www.dataguard.com/iso-27001/2022/"
    confidence: medium
    verified_by_human: false
    telemetry_check:
      derivable_from_telemetry: false
      source_field: "assets[].identity_access.mfa_enforced, .privileged_accounts_count"
      logic: "mfa_enforced and privileged_accounts_count are supporting signals only (e.g. many privileged accounts without MFA is a red flag) — they cannot confirm a documented access-control policy exists or is followed, which is what this control actually requires."
      check_type: null
      check_params: {}
    manual_attestation_required: true
    attestation_prompt: "Provide the current access control policy and evidence it governs how physical/logical access is granted, reviewed, and revoked."
    attestation_validity_months: null

  - id: access_rights_provisioning
    framework_ref: "A.5.18"
    parameter_name: "Access rights"
    weight: null
    description: "Access rights should be provisioned, reviewed, modified, and removed in accordance with the organization's access control policy and topic-specific policies."
    maturity_bands: null
    source: "https://hightable.io/iso-27001-2022-everything-you-need-to-know/ ; https://www.dataguard.com/iso-27001/2022/"
    confidence: medium
    verified_by_human: false
    telemetry_check:
      derivable_from_telemetry: false
      source_field: null
      logic: "No field in our schema captures access-rights review/revocation cadence."
      check_type: null
      check_params: {}
    manual_attestation_required: true
    attestation_prompt: "Provide evidence of the most recent access rights review (joiners/movers/leavers) and its date."
    attestation_validity_months: null

  - id: protection_against_malware
    framework_ref: "A.8.7"
    parameter_name: "Protection against malware"
    weight: null
    description: "Protection against malware should be implemented and supported by appropriate user awareness."
    maturity_bands: null
    source: "https://hightable.io/iso-27001-2022-everything-you-need-to-know/ ; https://www.dataguard.com/iso-27001/2022/"
    confidence: medium
    verified_by_human: false
    telemetry_check:
      derivable_from_telemetry: true
      source_field: "assets[].edr.agent_installed, .agent_healthy"
      logic: "Every in-scope asset must have an EDR agent installed and healthy; a null health value means never evaluated, not passing."
      check_type: "all_edr_agents_healthy"
      check_params: {}
    manual_attestation_required: false
    attestation_prompt: null
    attestation_validity_months: null

  - id: management_of_technical_vulnerabilities
    framework_ref: "A.8.8"
    parameter_name: "Management of technical vulnerabilities"
    weight: null
    description: "Information about technical vulnerabilities of information systems in use should be obtained, the organization's exposure evaluated, and appropriate measures taken."
    maturity_bands: null
    source: "https://hightable.io/iso-27001-2022-everything-you-need-to-know/ ; https://www.dataguard.com/iso-27001/2022/"
    confidence: medium
    verified_by_human: false
    telemetry_check:
      derivable_from_telemetry: true
      source_field: "assets[].findings[] where type==\"cve\", .kev_listed, .remediated_at"
      logic: "No unremediated finding may be both type=cve and kev_listed=true (an actively exploited vulnerability left open)."
      check_type: "no_unremediated_findings"
      check_params: { match: { type: "cve", kev_listed: true } }
    manual_attestation_required: false
    attestation_prompt: null
    attestation_validity_months: null

  - id: configuration_management
    framework_ref: "A.8.9"
    parameter_name: "Configuration management"
    weight: null
    description: "Configurations, including security configurations, of hardware, software, services, and networks should be established, documented, implemented, monitored, and reviewed."
    maturity_bands: null
    source: "https://hightable.io/iso-27001-2022-everything-you-need-to-know/ ; https://www.dataguard.com/iso-27001/2022/"
    confidence: medium
    verified_by_human: false
    telemetry_check:
      derivable_from_telemetry: true
      source_field: "assets[].findings[] where type==\"misconfiguration\" and provenance.connector==\"prowler_connector\""
      logic: "No unremediated cloud/config misconfiguration finding from the CSPM connector may remain open."
      check_type: "no_unremediated_findings"
      check_params: { match: { type: "misconfiguration", provenance_connector: "prowler_connector" } }
    manual_attestation_required: false
    attestation_prompt: null
    attestation_validity_months: null

  - id: information_backup
    framework_ref: "A.8.13"
    parameter_name: "Information backup"
    weight: null
    description: "Backup copies of information, software, and systems should be maintained and regularly tested in accordance with an agreed backup policy."
    maturity_bands: null
    source: "https://hightable.io/iso-27001-2022-everything-you-need-to-know/ ; https://www.dataguard.com/iso-27001/2022/"
    confidence: medium
    verified_by_human: false
    telemetry_check:
      derivable_from_telemetry: true
      source_field: "services[].backup.exists, .last_tested_at"
      logic: "Every in-scope service must have a backup that exists and was tested within core.assumptions.BACKUP_TEST_RECENCY_DAYS."
      check_type: "backup_tested_within_days"
      check_params: { days: null }
    manual_attestation_required: false
    attestation_prompt: null
    attestation_validity_months: null

  - id: networks_security
    framework_ref: "A.8.20"
    parameter_name: "Networks security"
    weight: null
    description: "Networks and network devices should be secured, managed, and controlled to protect information in systems and applications."
    maturity_bands: null
    source: "https://hightable.io/iso-27001-2022-everything-you-need-to-know/ ; https://www.dataguard.com/iso-27001/2022/"
    confidence: medium
    verified_by_human: false
    telemetry_check:
      derivable_from_telemetry: true
      source_field: "assets[].network.internet_facing, .open_ports"
      logic: "No internet-facing asset may expose a port on core.assumptions.DANGEROUS_INTERNET_FACING_PORTS (a heuristic list, not a substitute for an asset-specific expected-ports policy)."
      check_type: "no_dangerous_ports_on_internet_facing_assets"
      check_params: {}
    manual_attestation_required: false
    attestation_prompt: null
    attestation_validity_months: null

  - id: segregation_of_networks
    framework_ref: "A.8.22"
    parameter_name: "Segregation of networks"
    weight: null
    description: "Groups of information services, users, and information systems should be segregated on the organization's networks."
    maturity_bands: null
    source: "https://hightable.io/iso-27001-2022-everything-you-need-to-know/ ; https://www.dataguard.com/iso-27001/2022/"
    confidence: medium
    verified_by_human: false
    telemetry_check:
      derivable_from_telemetry: false
      source_field: null
      logic: "No network-segmentation field exists anywhere in schema/aggregated_assets.schema.json — this control cannot be telemetry-derived at all with the current schema. See docs/ASSUMPTIONS.md / schema-gap notes."
      check_type: null
      check_params: {}
    manual_attestation_required: true
    attestation_prompt: "Provide network architecture/segmentation diagrams and evidence that critical systems are isolated from general-purpose networks."
    attestation_validity_months: null

