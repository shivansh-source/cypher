# ---------------------------------------------------------------------------
# Penalty provisions
# ---------------------------------------------------------------------------
# IMPORTANT: this is the GENERAL RBI Act penalty power for non-compliance
# with any RBI direction applicable to an NBFC — it is NOT a penalty
# specific to the unconfirmed 2026 Directions described above (no such
# specific penalty clause could be found for the reason given in the
# top-of-file warning). Confidence is medium, not low, because Section 58G
# itself and its amount are corroborated by real, recent RBI penalty orders
# against named NBFCs (typically ₹2.7-8.1 lakh in practice — well below the
# statutory ceiling, since RBI applies the greater-of-two-amounts formula
# per violation and most publicized orders involve a single quantifiable
# violation, not the maximum stackable case).
penalty_provisions:
  - id: rbi_nbfc_58g_noncompliance
    statute: "Reserve Bank of India Act, 1934"
    provision_ref: "Section 58G(1)(b) read with Section 58B(5)"
    description: "General penalty power for an NBFC's non-compliance with any direction issued by RBI under the Act — the applicable power for non-compliance with IT/cybersecurity governance directions since no more specific penalty clause could be confirmed for the 2026 Directions specifically."
    penalty_amount_inr: 1000000.0
    penalty_formula: "₹10,00,000 (₹10 lakh) or twice the quantifiable amount involved in the contravention, whichever is higher; plus a continuing-default penalty of ₹1,00,000 (₹1 lakh) per day for as long as the default continues."
    currently_in_force: true
    in_force_from: null
    source: "Section 58G/58B text via indiankanoon.org and kanoongpt.in (secondary, not fetched from rbi.org.in's own Act text this session); amount corroborated by multiple real 2025-2026 RBI penalty orders against named NBFCs (studycafe.in, fintechbiznews.com, tradersunion.com, policypulsemedia.com)"
    confidence: medium
    verified_by_human: false
