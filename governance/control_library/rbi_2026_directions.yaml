# verification; it may reflect shared/copied source material rather than
# confirmed fact. Zero primary document, legal-database entry, or PDF was
# found for this specific notification.
#
# What IS confirmed: (1) RBI's 2017 "Information Technology Framework for
# the NBFC Sector" circular exists and is a plausible repeal target: this is
# the actual predecessor document for the NBFC sector specifically (distinct
# from the 2016 Cyber Security Framework circular for banks, which is what
# repo-root CLAUDE.md principle 8 refers to). (2) RBI's DAKSH supervisory
# platform is real (confirmed via an actual rbidocs.rbi.org.in press release
# and Business Standard coverage).
#
# EVERY entry below is confidence: low for this reason, regardless of how
# specific or consistent the underlying secondary sources sound. Treat this
# entire file as needing a human primary-source check — via RBI's own
