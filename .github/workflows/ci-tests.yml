name: CI / Tests

# Scoped from DroneAcharaya's ci-tests.yml. Cypher has no ML dependency
# footprint (no torch etc.) and no separate backend/requirements.txt — the
# project installs from pyproject.toml, and pytest.ini_options already
# points at core/tests, governance/tests, ai/tests.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
          cache: pip

      # See ci-deps.yml: actions/setup-python's bundled setuptools can carry
      # its own disclosed CVEs independent of anything this project
      # declares.
      - run: pip install --upgrade pip setuptools

      - name: Install project + dev tools
        run: pip install -e ".[dev]"

      - name: Run pytest
        run: pytest
